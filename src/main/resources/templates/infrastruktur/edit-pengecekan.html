<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit Pengecekan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('infrastruktur')}"></nav>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>';">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item h5"><a href="/infrastruktur">Infrastruktur</a></li>
                    <li class="breadcrumb-item h5"><a th:href="@{|/infrastruktur/${pasar.getId()}|}" th:text="${pasar.getNama()}"></a></li>
                    <li class="breadcrumb-item h5"><a th:href="@{|/infrastruktur/${infrastruktur.getId()}|}" th:text="${infrastruktur.getNamaInfrastruktur()}"></a></li>
                    <li class="breadcrumb-item active h5" aria-current="page"><span th:text="'Edit Pengecekan - ' + ${dto.getId()}"></span></li>
                </ol>
            </nav>
        </div>
    </div>
</div>

<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title"><h5>Data Infrastruktur</h5></div>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>ID Infrastruktur</strong>
                    <div th:text="${infrastruktur.getId()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Nama</strong>
                    <div th:text="${infrastruktur.getNamaInfrastruktur()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Penanggung Jawab</strong>
                    <div th:text="${infrastruktur.getPenanggungJawab()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Jenis Infrastruktur</strong>
                    <div th:text="${infrastruktur.getJenis()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Tanggal Pembangunan</strong>
                    <div th:text="${infrastruktur.getTanggalPembangunan()}"></div>
                </li>
            </ul>
        </div>
    </div>
</div>

<div class="container my-4">
    <div class="card">
        <form th:action="@{|/infrastruktur/pengecekan/edit/${infrastruktur.getId()}/${dto.getId()}|}" th:object="${dto}" method="post">
            <div class="card-body">
                <div class="card-title h5">
                    Edit Pengecekan
                </div>
                <input type="text" class="form-control d-none" th:field="*{id}">
                <input type="text" class="form-control d-none" th:field="*{infrastrukturID}">

                <div class="my-1">
                    <label for="tanggal">Tanggal</label>
                    <input id="tanggal" class="form-control" type="date" th:field="*{tanggal}">
                </div>

                <div class="my-1">
                    <label for="deskripsi">Deskripsi</label>
                    <input type="text" class="form-control" id="deskripsi" th:field="*{deskripsi}">
                </div>

                <div class="my-1">
                    <label for="pelakuPengecekan">Pelaku Pengecekan</label>
                    <input type="text" class="form-control" id="pelakuPengecekan" th:field="*{pelakuPengecekan}">
                </div>

                <div class="my-1">
                    <label for="biaya">Biaya</label>
                    <input id="biaya" class="form-control" type="number" th:field="*{biaya}">
                </div>

                <div class="my-1">
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
