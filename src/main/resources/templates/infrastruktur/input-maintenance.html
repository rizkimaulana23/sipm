<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Input Maintenance Infrastruktur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('infrastruktur')}"></nav>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>';">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item h5"><a href="/infrastruktur">Infrastruktur</a></li>
                    <li class="breadcrumb-item h5"><a th:href="@{|/infrastruktur/${infrastruktur.getPasar().getId()}|}" th:text="${infrastruktur.getPasar().getNama()}"></a></li>
                    <li class="breadcrumb-item h5"><a th:href="@{|/infrastruktur/detail/${infrastruktur.getId()}|}" th:text="${infrastruktur.getNamaInfrastruktur()}"></a></li>
                    <li class="breadcrumb-item active h5" aria-current="page"><span>Input Maintenance</span></li>
                </ol>
            </nav>
        </div>
    </div>
</div>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title"><h5>Data Infrastruktur</h5></div>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>ID Infrastruktur</strong>
                    <div th:text="${infrastruktur.getId()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Nama</strong>
                    <div th:text="${infrastruktur.getNamaInfrastruktur()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Penanggung Jawab</strong>
                    <div th:text="${infrastruktur.getPenanggungJawab()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Jenis Infrastruktur</strong>
                    <div th:text="${infrastruktur.getJenis()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Tanggal Pembangunan</strong>
                    <div th:text="${infrastruktur.getTanggalPembangunan()}"></div>
                </li>
            </ul>
        </div>
    </div>
</div>

<div class="container my-4">
    <div class="card">
        <form th:action="@{|/infrastruktur/detail/${infrastruktur.id}/input-maintenance|}" method="POST" th:object="${dto}">
            <div class="card-body">
                <div class="card-title h5">Input Maintenance</div>
                <input type="text" class="form-control" th:field="*{infrastrukturID}" style="display: none">

                <div class="my-1">
                    <label for="tanggal">Tanggal</label>
                    <input type="date" class="form-control" th:field="*{tanggal}" id="tanggal">
                </div>

                <div class="my-1">
                    <label for="biaya">Biaya Maintenance</label>
                    <input type="number" class="form-control" th:field="*{biaya}" id="biaya">
                </div>

                <div class="my-1">
                    <label for="pelaku">Pelaku Maintenance</label>
                    <input type="text" class="form-control" th:field="*{pelakuMaintenance}" id="pelaku">
                </div>

                <div class="my-1">
                    <label for="deskripsi">Deskripsi</label>
                    <textarea class="form-control" th:field="*{deskripsi}" id="deskripsi"></textarea>
                </div>

                <button type="submit" class="btn btn-primary container mt-1">Kirim</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
