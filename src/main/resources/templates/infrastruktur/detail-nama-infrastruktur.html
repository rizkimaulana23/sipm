<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detail Infrastruktur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('infrastruktur')}"></nav>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>';">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item h5"><a href="/infrastruktur">Infrastruktur</a></li>
                    <li class="breadcrumb-item h5"><a th:href="@{|/infrastruktur/${infrastruktur.getPasar().getId()}|}" th:text="${infrastruktur.getPasar().getNama()}"></a></li>
                    <li class="breadcrumb-item active h5" aria-current="page" ><span th:text="${infrastruktur.getNamaInfrastruktur()}"></span></li>
                </ol>
            </nav>
        </div>
    </div>
</div>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title"><h5>Data Infrastruktur</h5></div>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>ID Infrastruktur</strong>
                    <div th:text="${infrastruktur.getId()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Nama</strong>
                    <div th:text="${infrastruktur.getNamaInfrastruktur()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Penanggung Jawab</strong>
                    <div th:text="${infrastruktur.getPenanggungJawab()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Jenis Infrastruktur</strong>
                    <div th:text="${infrastruktur.getJenis()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Tanggal Pembangunan</strong>
                    <div th:text="${infrastruktur.getTanggalPembangunan()}"></div>
                </li>
            </ul>
        </div>
    </div>
</div>

<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title"><h5>Riwayat Pengecekan</h5></div>
            <table id="pengecekan-table">
                <thead>
                <tr>
                    <th>No</th>
                    <th>ID</th>
                    <th>Tanggal</th>
                    <th>Deskripsi</th>
                    <th>Pelaku Pengecekan</th>
                    <th>Biaya Pengecekan</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="data, iter : ${listPengecekan}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${data.id}"></td>
                    <td th:text="${data.tanggal}"></td>
                    <td th:text="deskripsi"></td>
                    <td th:text="${data.pelakuPengecekan}"></td>
                    <td th:text="${data.biaya}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title"><h5>Riwayat Maintenance</h5></div>
            <table id="maintenance-table">
                <thead>
                <tr>
                    <th>No</th>
                    <th>ID</th>
                    <th>Tanggal</th>
                    <th>Deskripsi</th>
                    <th>Pelaku Maintenance</th>
                    <th>Biaya Maintenance</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="data, iter: ${listMaintenance}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${data.id}"></td>
                    <td th:text="${data.tanggalMaintenance}"></td>
                    <td th:text="${data.deskripsi}"></td>
                    <td th:text="${data.pelakuMaintenance}"></td>
                    <td th:text="${data.biaya}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    new DataTable('#pengecekan-table');
    new DataTable('#maintenance-table');
</script>
</body>
</html>
