<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav th:fragment="navbar(menuSelected)" class="navbar navbar-expand-lg">

    <div class="container-fluid">
        <a class="navbar-brand fw-bold main-title" style="color: #F8981D">Sistem Informasi Pasar Merdeka</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${menuSelected == 'home'} ? 'active' : ''">Beranda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/infrastruktur}" th:classappend="${menuSelected == 'infrastruktur'} ? 'active' : ''">Infrastruktur</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transaksi}" th:classappend="${menuSelected == 'transaksi'} ? 'active' : ''">Transaksi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/stok}" th:classappend="${menuSelected == 'stok'} ? 'active' : ''">Stok</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-QF0KkzI+t3rXlDPH1jGxAqW2mU0FJd7EnbI6zsb5Lf8h5IoD2RpPUEChGTDJYkPb" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-zMCcDDp9hG5IMuQKZJcKZX4Bdnc5rEi3kO3l0HT3IsOfFLkzHTPpGh9RufNViIv0" crossorigin="anonymous"></script>

</html>
