<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<nav th:fragment="navbar(menuSelected)" class="navbar navbar-expand-lg">

    <div class="container-fluid">
        <a class="navbar-brand fw-bold main-title" style="color: #F8981D">Sistem Informasi Pasar Merdeka</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${menuSelected == 'home'} ? 'active' : ''">Beranda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/infrastruktur}" th:classappend="${menuSelected == 'infrastruktur'} ? 'active' : ''">Infrastruktur</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transaksi}" th:classappend="${menuSelected == 'transaksi'} ? 'active' : ''">Transaksi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/stok}" th:classappend="${menuSelected == 'stok '} ? 'active' : ''">Stok</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
