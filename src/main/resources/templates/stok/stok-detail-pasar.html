<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detail Pasar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .hover-card {
            transition: transform 0.3s, border-color 0.3s;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .hover-card:hover {
            transform: translateY(-5px);
            border-color: #F8981D;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('stok')}"></nav>

<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>';">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item h5"><a href="/stok">Stok</a></li>
                    <li class="breadcrumb-item active h5" aria-current="page"><span th:text="${pasar.getNama()}"></span></li>
                </ol>
            </nav>
        </div>
    </div>
</div>

<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title">
                <h4>Data Pasar</h4>
            </div>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>ID</strong>
                    <div th:text="${pasar.getId()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Nama Pasar</strong>
                    <div th:text="${pasar.getNama()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Alamat</strong>
                    <div th:text="${pasar.getAlamat()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Kota</strong>
                    <div th:text="${pasar.getKota()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Nominal Retribusi</strong>
                    <div th:text="${pasar.getRetribusi()}"></div>
                </li>
            </ul>
        </div>
    </div>
</div>


<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title h4">Daftar Toko</div>
            <div class="row">
                <div th:each="entry : ${mapTokoJenisBarang}" class="col-md-4 mb-4">
                    <a class="card h-100 hover-card" th:href="@{|/stok/toko/${entry.key.getId()}|}">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${entry.key.getNamaToko()}"></h5>
                            <p class="card-text">
                                <strong>Alamat:</strong> <span th:text="${entry.key.getAlamatToko()}"></span>
                            </p>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center"
                                    th:each="barang : ${entry.value.entrySet()}">
                                    <span th:text="${barang.key}"></span>
                                    <span th:text="${barang.value}"></span>
                                </li>
                            </ul>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>


<script>

</script>
</body>
</html>
