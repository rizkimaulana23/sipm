<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Stok All Pasar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('stok')}"></nav>
<!--<div>-->
<!--    <canvas id="line-chart"></canvas>-->
<!--</div>-->
<!--<div>-->
<!--    <canvas id="bar-chart"></canvas>-->
<!--</div>-->
<div class="container">
    <div class="card">
        <div class="card-body">
            <div class="card-title h5 d-flex text-center">Jenis Barang</div>
            <table class="table text-center align-middle">
                <thead>
                    <tr>
                        <th scope="col" class="align-middle">No</th>
                        <th scope="col" class="align-middle">Jenis Barang</th>
                        <th scope="col" class="align-middle">Rata-Rata Stok Periode Ini (TANGGAL X - TANGGAL Y)</th>
                        <th scope="col" class="align-middle">Rata-Rata Stok Periode Kemarin (TANGGAL X - TANGGAL Y)</th>
                        <th scope="col" class="align-middle">Perubahan Stok</th>
                    </tr>
                </thead>
                <tbody>
                <tr th:each="jenisBarang, iter : ${listJenisBarang}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${jenisBarang}"></td>
                    <td th:text="${stokService.calculateAverageThisPeriod(jenisBarang)}"></td>
                    <td th:text="${stokService.calculateAveragePreviousPeriod(jenisBarang)}"></td>
                    <td th:with="result = ${stokService
                            .calculatePercentageDifferent(
                                stokService.calculateAverageThisPeriod(jenisBarang),
                                stokService.calculateAveragePreviousPeriod(jenisBarang))}">
                        <div class="text-center align-middle" th:if="${result.startsWith('-')}">
                            <img th:src="@{/icons/Arrow Down Red.svg}" alt="Down">
                            <span th:text="${result}" style="color: red"></span>
                        </div>

                        <div class="text-center align-middle" th:if="${!result.startsWith('-')}">
                            <img th:src="@{/icons/Arrow Up Green.svg}" alt="Up">
                            <span th:text="${result}" style="color:green"></span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title h5">Total Stok Tiap Pasar</div>
            <table id="main-table">
                <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Pasar</th>
                    <th>Alamat</th>
                    <th>Kota</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="data, iter : ${listPasar}">
                    <td th:text="${iter.count}"></td>
                    <td>
                        <a th:href="@{|/stok/${data.id}|}" th:text="${data.getNama()}"></a>
                    </td>
                    <td th:text="${data.alamat}"></td>
                    <td th:text="${data.kota}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    new DataTable('#main-table');

</script>
</body>
</html>
