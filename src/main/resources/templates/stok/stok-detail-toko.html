<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detail Toko</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('stok')}"></nav>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title">
                <h4>Data Toko</h4>
            </div>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>ID</strong>
                    <div th:text="${toko.getId()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Nama</strong>
                    <div th:text="${toko.getNamaToko()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Pasar</strong>
                    <div th:text="${toko.getPasar().getNama()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Kontak Penjual</strong>
                    <div th:text="${toko.getKontakPenjual()}"></div>
                </li>
            </ul>
        </div>
    </div>
</div>


<script>

</script>

</body>
</html>
