<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detail Toko</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .table th {
            width: 10%;
        }
        .table th:nth-child(2) {
            width: 30%;
        }
        .table th:nth-child(3),
        .table th:nth-child(4),
        .table th:nth-child(5) {
            width: 20%;
        }
    </style>

</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('stok')}"></nav>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>';">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item h5"><a href="/stok">Stok</a></li>
                    <li class="breadcrumb-item h5"><a th:href="@{|/stok/${toko.getPasar().getId()}|}" th:text="${toko.getPasar().getNama()}"></a></li>
                    <li class="breadcrumb-item active h5" aria-current="page"><span th:text="${toko.getNamaToko()}"></span></li>
                </ol>
            </nav>
        </div>
    </div>
</div>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title">
                <h4>Data Toko</h4>
            </div>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>ID</strong>
                    <div th:text="${toko.getId()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Nama</strong>
                    <div th:text="${toko.getNamaToko()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Pasar</strong>
                    <div th:text="${toko.getPasar().getNama()}"></div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Kontak Penjual</strong>
                    <div th:text="${toko.getKontakPenjual()}"></div>
                </li>
            </ul>
        </div>
    </div>
</div>

<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="card-title">
                <h4>Filter Jenis Barang</h4>
            </div>
            <div class="row">
                <div class="col-md-4 col-sm-6 col-12 mb-2" th:each="jenisBarang : ${listJenisBarang}">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:attr="id=${'filter-' + jenisBarang}" th:value="${jenisBarang}" checked>
                        <label class="form-check-label" th:attr="for=${'filter-' + jenisBarang}" th:text="${jenisBarang}"></label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <div th:each="data, iter : ${mapBarangPokok}" class="container my-1" th:attr="id=${'section-' + data.key}">
                <span class="h5" th:text="${data.key}"></span>
                <table class="table text-center align-middle"  style="table-layout: fixed;">
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Stok</th>
                        <th>Tanggal Kadaluarsa</th>
                        <th>Tanggal Masuk</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="barang, iters : ${data.getValue()}">
                        <td th:text="${iters.count}"></td>
                        <td th:text="${barang.nama}"></td>
                        <td th:text="${barang.stok}"></td>
                        <td th:text="${barang.tanggalKadaluarsa}"></td>
                        <td th:text="${barang.tanggalMasuk}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('.form-check-input').on('change', function() {
            const jenisBarang = $(this).val();
            const sectionId = '#section-' + jenisBarang;
            if ($(this).is(':checked')) {
                $(sectionId).show();
            } else {
                $(sectionId).hide();
            }
        });
    });
</script>


</body>
</html>
