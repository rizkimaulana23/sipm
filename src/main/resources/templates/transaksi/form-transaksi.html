<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Form Input Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('transakasi')}"></nav>
<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>';">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item h5"><a href="/transaksi">Transaksi</a></li>
                    <li class="breadcrumb-item h5"><a th:href="@{|/transaksi/${pasar.getId()}|}" th:text="${pasar.getNama()}"></a></li>
                    <li class="breadcrumb-item active h5"><span>Input Transaksi</span></li>
                </ol>
            </nav>
        </div>
    </div>
</div>


<form th:action="@{|/transaksi/${pasar.getId()}/input-transaksi|}" th:object="${dto}" method="POST">
    <div class="container">
        <div class="card">
            <div class="card-body">
                <label for="idToko">Toko</label>
                <select name="idToko" id="idToko" class="form-select">
                    <option selected value="">Pilih toko</option>
                    <option th:each="toko: ${listToko}" th:text="${toko.getNamaToko()}" th:value="${toko.getId()}"></option>
                </select>
                <button class="btn btn-primary container mt-4" type="submit" name="add">
                    Tambah Toko
                </button>
            </div>
        </div>
    </div>
    <div class="container my-4">
        <div class="card">
            <div class="card-body">
                <label for="tanggal">Tanggal Pendapatan</label>
                <input type="date" class="form-control" th:field="*{tanggal}" id="tanggal">
            </div>
        </div>
    </div>

    <div class="container my-4">
        <div class="card">
            <div class="card-body" >
                <div class="card-title h4">
                    Daftar Toko
                </div>
                <div class="row row-cols-1 row-cols-md-2 g-4">
                    <div th:each="toko, iter : *{listToko}" class="col">
                        <a class="card h-100 hover-card">
                            <div class="card-body">
                                <input type="hidden" th:field="*{listToko[__${iter.index}__].id}">
                                <input type="hidden" th:field="*{listToko[__${iter.index}__].namaToko}">
                                <h5 class="card-title" th:text="${toko.getNamaToko()}"></h5>
                                <label for="pendapatan">Pendapatan Harian</label>
                                <input class="form-control" type="text" id="pendapatan" th:field="*{listPendapatan[__${iter.index}__]}">
                                <button class="btn btn-danger" name="delete" th:value="${iter.index}">Hapus Toko</button>
                            </div>
                        </a>
                    </div>
                </div>
                <button class="btn btn-primary container mt-4" type="submit">
                    Submit
                </button>
            </div>

        </div>
    </div>
</form>

</body>
</html>
